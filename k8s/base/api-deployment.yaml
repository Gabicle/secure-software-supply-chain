apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: supply-chain
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: secure-software-supply-chain

spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api

  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: secure-software-supply-chain

    spec:
      containers:
        - name: api
          image: backend-image

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-database
                  key: DATABASE_URL

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
