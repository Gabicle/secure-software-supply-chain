apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secure-software-supply-chain-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Gabicle/secure-software-supply-chain.git
    targetRevision: main
    path: k8s/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: supply-chain

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
