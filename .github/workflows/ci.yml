name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_images:
        description: "Publish scanned images to ECR and sign them"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  AWS_REGION: eu-west-3
  AWS_ROLE_ARN: arn:aws:iam::542489916995:role/SecureSupplyChainGitHubActionsEcrRole
  ECR_BACKEND_REPOSITORY: secure-software-supply-chain-dev-backend
  ECR_FRONTEND_REPOSITORY: secure-software-supply-chain-dev-frontend

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install backend dependencies
        run: pip install --require-hashes -r app/requirements.txt

      - name: Compile backend
        run: python -m compileall -q app

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  secrets:
    name: Secret Scanning
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"

  sast:
    name: SAST
    runs-on: ubuntu-24.04

    container:
      image: semgrep/semgrep@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        run: semgrep scan --config auto --error app frontend/src

  sca:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-24.04

    container:
      image: aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan application dependencies
        run: >
          trivy fs .
          --scanners vuln
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1

  container-build:
    name: Container Build and Scan
    runs-on: ubuntu-24.04
    needs:
      - backend
      - frontend
      - secrets
      - sast
      - sca

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build backend image
        run: docker build --tag secure-backend:${{ github.sha }} ./app

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: secure-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Generate backend SBOM
        run: |
          mkdir -p sbom
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/sbom:/output" \
            anchore/syft@sha256:500e2d872ac019436926e8322b4fc1f39441d94d21f6f4046c6ff29b30e8cb02 \
            secure-backend:${{ github.sha }} \
            -o cyclonedx-json=/output/backend-sbom.cdx.json

      - name: Build frontend image
        run: docker build --tag secure-frontend:${{ github.sha }} ./frontend

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: secure-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Generate frontend SBOM
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/sbom:/output" \
            anchore/syft@sha256:500e2d872ac019436926e8322b4fc1f39441d94d21f6f4046c6ff29b30e8cb02 \
            secure-frontend:${{ github.sha }} \
            -o cyclonedx-json=/output/frontend-sbom.cdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom/backend-sbom.cdx.json
            sbom/frontend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Export scanned container images
        run: |
          docker save \
            secure-backend:${{ github.sha }} \
            secure-frontend:${{ github.sha }} \
            | gzip > scanned-images.tar.gz

      - name: Upload scanned container images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scanned-images-${{ github.sha }}
          path: scanned-images.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish-images:
    name: Publish Images to ECR
    runs-on: ubuntu-24.04
    needs:
      - container-build

    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_images == true

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Download scanned container images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8
        with:
          name: scanned-images-${{ github.sha }}

      - name: Load scanned container images
        run: gunzip -c scanned-images.tar.gz | docker load

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Push backend image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag \
            "secure-backend:$IMAGE_TAG" \
            "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG"

          docker push "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG"

          BACKEND_DIGEST="$(
            docker inspect \
              --format='{{index .RepoDigests 0}}' \
              "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG"
          )"

          echo "BACKEND_IMAGE=$BACKEND_DIGEST" >> "$GITHUB_ENV"

      - name: Push frontend image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag \
            "secure-frontend:$IMAGE_TAG" \
            "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG"

          docker push "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG"

          FRONTEND_DIGEST="$(
            docker inspect \
              --format='{{index .RepoDigests 0}}' \
              "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG"
          )"

          echo "FRONTEND_IMAGE=$FRONTEND_DIGEST" >> "$GITHUB_ENV"

      - name: Sign container images
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "$BACKEND_IMAGE"
          cosign sign "$FRONTEND_IMAGE"
